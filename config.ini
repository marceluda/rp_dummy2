# Este es un archivo de configuracion

; comentario 1

[general]

# Name of the App (folder and URL). The NAME argument of new_project.py replaces it.
# Letters, digits, "_", "+" and "-", starting with a letter.
AppName        = my_app

# Should the new app include the original function generator verilog module?
include_genfun = False

# Should the new app include the original function PID verilog module?
include_pids   = False

# Register map of the dummy module (0x40600000):
#   fixed  (default) template registers at 0x000-0x0FC, the controls below from 0x100 in this order
#   legacy           controls right after the template registers (layout of the old rp_dummy)
register_map   = fixed

# Board for "make upload" (written to _settings.env of the project)
rp_host        =rp-XXXXXX.local
ssh_opts       =-l root -p 22
scp_opts       =-P 22

#### From now on, each section is a control to be added ####################
# Each control section name is the reg/wire value in the fpga source code

[comboA]
# Combo box type controller
type        = combo

# Label is the label text for the controller
label       = Combo A

# Number of bits of the reg/wire.
# For unsigned values, values goes from 0 to (2^bits_number-1)
# For signed values, values goes from (-2^[bits_number-1]) to (2^[bits_number-1]-1)
# combo: 1..8 bits; number and monitor: 1..32 bits; checkbox and button: always 1 bit
bits_number = 4
signed      = False

# Optional (not for monitors): value after reset, in the FPGA, the C controller and the web page
;default     = 0

[comboB]
type        = combo
label       = Combo B
bits_number = 2
# Optional, combo only: text of the options 0, 1, 2... Default: if the combo is the select of a muxer of
# dummy.v (.sel(comboB)), the names of the muxer inputs (see [names] below); otherwise the numbers.
options     = off, slow, medium, fast
default     = 1

[numberA]
type        = number
label       = Number A
bits_number = 14
signed      = True

[numberB]
type        = number
label       = Number B
bits_number = 14
signed      = True

[checkboxA]
type        = checkbox
label       = Checkbox A
#Checkbox alwasy has bits_number = 1
;bits_number = 14
;signed      = True

[checkboxB]
type        = checkbox
label       = Checkbox B

[buttonA]
type        = button
label       = Button A
#Button alwasy has bits_number = 1
;bits_number = 14
;signed      = True

[buttonB]
type        = button
label       = Button B

## Monitor controls

[monitorA]
# Monitor control is read only type. Just show the value of a wire/reg
type        = monitor
label       = Monitor A 14 bits
bits_number = 14
signed      = True
# Optional: how the value is shown in the web page (Raw Mode always shows the integer)
#   display = int     the integer value (default)
#   display = volts   value / 8192 in V (scale of the 14-bit ADC/DAC signals: 8192 counts = 1 V)
#   scale = 8e-9      value * scale, with  unit = s  (SI prefixes are added: ns, us, ms...)
display     = int

[monitorB]
type        = monitor
label       = Monitor B 14 bits
bits_number = 14
signed      = True
display     = volts


[monitorC]
type        = monitor
label       = Monitor C 27 bits
bits_number = 27
signed      = True
scale       = 8e-9
unit        = s

[monitorD]
type        = monitor
label       = Monitor D 27 bits
bits_number = 27
signed      = True


## Names of the muxer inputs in the combo boxes (optional)
# The combo boxes of the muxers of dummy.v (Osc A / Osc B, Out1 / Out2, slow outputs, and the combos of this file
# used as the .sel of a muxer) show one option per muxer input. Its text is the one given here for the wire (or
# expression) connected to the input; else the label of the control with that name (e.g. numberA -> "Number A");
# else the wire name. config_tool.py writes every combo value and its text in <App>/c/names_dic.txt.
#[names]
#in1      = IN1 (ADC)
#my_wire  = My signal
