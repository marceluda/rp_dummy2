# Ecosystem 2.0: included by nginx for the location of the App (/opt/redpitaya/www/apps/<App>/nginx.conf).
# new_project.py writes the App name below; the Makefile changes it for the _DEBUG / _RELOAD packages.

# Do not cache index.html: after an App upgrade the browser must load the new UI
# (an old cached index.html sends oversized POSTs that hang on Ecosystem 2.0).
# Exact-match locations (same effect as ~ ^/<App>/(index\.html)?$ , without regex escaping of the name).
location = /dummy/ {
    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    expires off;
}
location = /dummy/index.html {
    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    expires off;
}
