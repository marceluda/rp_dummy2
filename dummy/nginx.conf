# Ecosystem 2.0: included by nginx for the location of the App (/opt/redpitaya/www/apps/<App>/nginx.conf).
# nginx reads it only when it starts: after the first upload (or a change) restart it (upload_app.sh -r).
# new_project.py writes the App name below.
# Endpoints ported from rp_lock-in_pid_h v2.3.28 (exact-match locations, no regex escaping of the name).

# Do not cache index.html: after an App upgrade the browser must load the new UI
# (an old cached index.html sends oversized POSTs that hang on Ecosystem 2.0).
location = /dummy/ {
    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    expires off;
}
location = /dummy/index.html {
    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    expires off;
}

# Address of the client as seen by the board (e.g. for stream_ip)
location = /dummy/get_ip {
    default_type text/plain;
    content_by_lua '
        ngx.say(ngx.var.remote_addr)
    ';
}

# Registers of the dummy module (c/dummy):  /<App>/dummy                     every register
#                                           /<App>/dummy?numberA             read
#                                           /<App>/dummy?numberA=1234&comboA write numberA, read comboA
# Only register names ([A-Za-z0-9_]) and decimal integers are passed to the program (never a raw string to
# the shell); the program checks the names, read-only registers and ranges ("ERROR: ..." line).
location = /dummy/dummy {
    default_type text/plain;
    content_by_lua '
        local args = ngx.req.get_uri_args(40)
        local cmd  = "/opt/redpitaya/www/apps/dummy/c/dummy"
        for kk, vv in pairs(args) do
            if type(vv) == "table" then vv = vv[#vv] end
            if type(kk) == "string" and string.match(kk, "^[%w_]+$") and #kk <= 64 then
                if vv == true or vv == "" then
                    cmd = cmd .. " " .. kk
                elseif type(vv) == "string" and #vv <= 12 and string.match(vv, "^%-?%d+$") then
                    cmd = cmd .. " " .. kk .. " " .. vv
                else
                    ngx.status = 400
                    ngx.say("ERROR: bad value for " .. kk)
                    return ngx.exit(400)
                end
            else
                ngx.status = 400
                ngx.say("ERROR: bad register name")
                return ngx.exit(400)
            end
        end
        local file   = io.popen(cmd)
        local output = file:read("*all")
        file:close()
        if string.match(output, "^ERROR") then ngx.status = 400 end
        ngx.print(output)
    ';
}

