# Calibration of the board
location = /dummy/calib {
    default_type text/plain;
    content_by_lua '
        local file   = io.popen("/opt/redpitaya/bin/calib -rv")
        local output = file:read("*all")
        file:close()
        ngx.print(output)
    ';
}

# Streaming of the scope to a TCP client: set stream_ip / stream_port / stream_rate with /<App>/dummy, call
# /<App>/streaming (starts c/streaming, detached: it waits for stream_cmd), then /<App>/dummy?stream_cmd=1.
# Stop: /<App>/dummy?stream_cmd=0 (also when the App stops).
location = /dummy/streaming {
    default_type text/plain;
    content_by_lua '
        os.execute("/bin/sh /opt/redpitaya/www/apps/dummy/c/stream_start.sh")
        ngx.say("OK")
    ';
}

# 0: c/streaming running, 1: not running
location = /dummy/check_streaming {
    default_type text/plain;
    content_by_lua '
        local f   = io.popen("/bin/pidof /opt/redpitaya/www/apps/dummy/c/streaming")
        local out = f and f:read("*all") or ""
        if f then f:close() end
        if string.match(out, "%d") then ngx.say(0) else ngx.say(1) end
    ';
}
